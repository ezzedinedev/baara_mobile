<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:800;src:url(outfit-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;src:url(inter-latin-500-normal.woff2) format('woff2')}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
.b{position:relative;width:1024px;height:500px;background:#26472B;overflow:hidden;font-family:Inter,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 92% -10%,rgba(120,235,84,.30),rgba(120,235,84,0) 55%)}
.mark{position:absolute;right:-40px;bottom:-70px;width:420px;opacity:1}
.txt{position:absolute;left:72px;top:96px;width:560px}
.logo{height:64px;display:block;margin-bottom:44px}
h1{font-family:Outfit,sans-serif;font-weight:800;font-size:58px;line-height:1.05;letter-spacing:-1.5px;color:#fff;margin:0 0 22px}
h1 em{font-style:normal;color:#78EB54}
p{margin:0;color:rgba(255,255,255,.78);font-size:23px;font-weight:500}
.chips{display:flex;gap:10px;margin-top:26px}
.chip{border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 16px;font-size:17px;font-weight:500}
</style>
<div class="b">
  <div class="glow"></div>
  <svg class="mark" viewBox="0 0 175.54 204" xmlns="http://www.w3.org/2000/svg">
    <g opacity=".08" stroke="#fff" stroke-width="37.1" stroke-linecap="round">
      <line x1="87.77" y1="116.28" x2="18.55" y2="42.15"/><line x1="87.77" y1="116.28" x2="156.99" y2="42.15"/>
      <line x1="87.77" y1="116.28" x2="43.32" y2="185.4"/><line x1="87.77" y1="116.28" x2="132.22" y2="185.4"/>
    </g><circle cx="87.77" cy="27.2" r="27.2" fill="#78EB54" opacity=".18"/>
  </svg>
  <div class="txt">
    <img class="logo" src="logo_light.png" alt="">
    <h1>Le travail<br><em>commence ici.</em></h1>
    <p>L'emploi et la formation au Burkina Faso.</p>
    <div class="chips"><span class="chip">Offres vérifiées</span><span class="chip">CV gratuit</span><span class="chip">Formations</span></div>
  </div>
</div>
