name: baara
description: Baara — Plateforme de recrutement du Burkina Faso
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    

  get: ^4.6.6
  http: ^1.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  file_picker: ^11.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  image_picker: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.14.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  syncfusion_flutter_pdfviewer: ^33.2.10
  video_player: ^2.11.1
  chewie: ^1.10.0
  youtube_player_flutter: ^10.0.1
  photo_view: ^0.15.0
  iconly:
    path: packages/iconly
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0
  firebase_crashlytics: ^5.2.3
  web_socket_channel: ^3.0.1
  webview_flutter: ^4.7.0
  permission_handler: ^11.3.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  confetti: ^0.8.0
  emoji_picker_flutter: ^4.3.0
  custom_refresh_indicator: ^4.0.1
  share_plus: ^10.1.4
  app_links: ^6.3.2
  sensors_plus: ^6.1.1
  connectivity_plus: ^6.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icônes de lancement Baara (remplacent le logo Flutter par défaut).
# Régénérer après modif : `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/baara_icon.png"
  # Android : icône adaptative (fond de marque + symbole détouré).
  android: "ic_launcher"
  adaptive_icon_background: "#78EB54"
  adaptive_icon_foreground: "assets/icon/baara_icon_foreground.png"
  min_sdk_android: 21
  # iOS n'accepte pas la transparence : on aplatit sur le fond de marque.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#78EB54"
  # Web + PWA.
  web:
    generate: true
    background_color: "#26472B"
    theme_color: "#26472B"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/landing/
    - assets/images/logo/
    - assets/images/operators/
    - assets/icon/
